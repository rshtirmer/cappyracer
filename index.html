<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CappyRacer 🐹🏁</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: monospace; }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #fff;
      font-size: 24px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.75);
      z-index: 20;
      color: #fff;
    }
    .overlay.hidden { display: none; }

    .overlay h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .overlay p {
      font-size: 20px;
      margin-bottom: 10px;
      color: #aaa;
    }
    .overlay .score-display {
      font-size: 28px;
      margin: 10px 0;
    }
    .overlay button {
      margin-top: 30px;
      padding: 12px 40px;
      font-size: 20px;
      font-family: monospace;
      font-weight: bold;
      color: #fff;
      background: #44aaff;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .overlay button:hover { background: #66ccff; }

    #countdown {
      position: fixed; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      z-index: 30; pointer-events: none;
      font-family: 'Quicksand', monospace, sans-serif;
      font-weight: 700; font-size: 22vh;
      color: #fff8e8;
      text-shadow: 0 0 24px rgba(255,160,80,0.9), 4px 6px 0 rgba(0,0,0,0.35);
    }
    #countdown.go { color: #8effa0; font-size: 18vh; text-shadow: 0 0 30px rgba(120,255,140,0.9), 4px 6px 0 rgba(0,0,0,0.35); }

    #track-select {
      display: flex; gap: 12px; margin: 14px 0 6px;
      flex-wrap: wrap; justify-content: center;
    }
    .track-tile {
      width: 156px; padding: 12px; border-radius: 10px; cursor: pointer;
      background: rgba(255,255,255,0.08); border: 3px solid transparent;
      color: #fff; text-align: center; transition: background .15s, border-color .15s;
    }
    .track-tile:hover { background: rgba(255,255,255,0.16); }
    .track-tile.selected { border-color: #ffd54a; background: rgba(255,213,74,0.18); }
    .track-tile.locked { opacity: 0.45; cursor: not-allowed; }
    .track-tile .tname { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .track-tile .tinfo { font-size: 12px; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="countdown"></div>

  <div id="menu-overlay" class="overlay">
    <h1>🐹 CAPPYRACER 🏁</h1>
    <p>Steer &larr; &rarr; &middot; Accelerate &uarr; &middot; Brake / reverse &darr; &middot; Drift <b>Shift</b> &middot; Item <b>Space</b></p>
    <p>Race 3 laps. Drift through corners for a boost, grab item boxes, hit the hot-spring pads. Stay on the asphalt!</p>
    <div id="track-select"></div>
    <button id="play-btn">PLAY</button>
  </div>

  <div id="gameover-overlay" class="overlay hidden">
    <h1>🏁 FINISH! 🏁</h1>
    <div class="score-display" id="final-score">Time: 0:00.00</div>
    <div class="score-display" id="best-score" style="font-size:20px;color:#aaa;">Best: 0:00.00</div>
    <button id="restart-btn">RACE AGAIN</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
