<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CappyRacer · Rider Tuner</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0a16; color: #fff; font-family: 'Quicksand', sans-serif; overflow: hidden; }
    canvas { display: block; }
    #panel {
      position: fixed; top: 0; left: 0; bottom: 0; width: 320px; z-index: 5;
      background: rgba(16,11,28,0.92); border-right: 1px solid rgba(255,255,255,0.12);
      padding: 16px; overflow-y: auto;
    }
    h1 { font-family: 'Baloo 2', cursive; font-size: 20px; margin-bottom: 2px; }
    .hint { font-size: 12px; color: #b9aede; margin-bottom: 12px; line-height: 1.4; }
    .chars { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .chip {
      font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #efe9ff; cursor: pointer;
    }
    .chip.active { background: var(--gold, #ffd54a); color: #1c1330; border-color: #ffd54a; }
    .row { margin-bottom: 11px; }
    .row label { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; margin-bottom: 3px; }
    .row label .v { color: #ffd54a; font-variant-numeric: tabular-nums; }
    .row input[type=range] { width: 100%; }
    .btns { display: flex; gap: 8px; margin: 8px 0 12px; }
    button {
      flex: 1; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 12.5px;
      padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08); color: #fff; cursor: pointer;
    }
    button.primary { background: #ffd54a; color: #1c1330; border: none; }
    button:hover { filter: brightness(1.1); }
    #out {
      width: 100%; height: 168px; font-family: ui-monospace, monospace; font-size: 11px;
      background: #070510; color: #b8f0c0; border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px; padding: 8px; resize: vertical; white-space: pre;
    }
    .toggle { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 10px; }
    .small { font-size: 11px; color: #9a8fc0; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>🐹 Rider Tuner</h1>
    <div class="hint">Pick a character, drag to orbit the camera, and nudge the sliders. Hit <b>Copy</b> and paste the block back to me — I'll bake the values into the game.</div>
    <div class="chars" id="chars"></div>

    <div class="row"><label>Size (height) <span class="v" id="v-height"></span></label><input type="range" id="height" min="0.4" max="2.4" step="0.01"></div>
    <div class="row"><label>Left / Right (X) <span class="v" id="v-seatX"></span></label><input type="range" id="seatX" min="-1.2" max="1.2" step="0.01"></div>
    <div class="row"><label>Up / Down (Y) <span class="v" id="v-seatY"></span></label><input type="range" id="seatY" min="-0.5" max="1.8" step="0.01"></div>
    <div class="row"><label>Fwd / Back (Z) <span class="v" id="v-seatZ"></span></label><input type="range" id="seatZ" min="-1.5" max="1.5" step="0.01"></div>
    <div class="row"><label>Rotate (yaw°) <span class="v" id="v-yaw"></span></label><input type="range" id="yaw" min="0" max="360" step="5"></div>

    <label class="toggle"><input type="checkbox" id="animate"> Play idle animation</label>

    <div class="btns">
      <button id="reset">Reset</button>
      <button id="copy" class="primary">Copy all</button>
    </div>
    <div class="small">Current roster (live):</div>
    <textarea id="out" readonly></textarea>
  </div>
  <script type="module" src="/src/_riderTuner.js"></script>
</body>
</html>
